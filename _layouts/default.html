<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign page_title = page.title | default: site.tagline %}
  <title>{% if page.url == "/" %}{{ site.title }} | {{ site.tagline }}{% else %}{{ page_title }} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% if site.demo %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page_title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/img/showroom.jpg' | absolute_url }}">
  <meta name="theme-color" content="#1b1c1e">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HomeAndConstructionBusiness",
    "name": {{ site.business.legal_name | jsonify }},
    "telephone": {{ site.business.phone | jsonify }},
    "email": {{ site.business.email | jsonify }},
    "url": {{ site.url | jsonify }},
    "foundingDate": "2006",
    "priceRange": "$",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": {{ site.business.street | jsonify }},
      "addressLocality": {{ site.business.city | jsonify }},
      "addressRegion": {{ site.business.state | jsonify }},
      "postalCode": {{ site.business.zip | jsonify }},
      "addressCountry": "US"
    },
    "openingHoursSpecification": [
      { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "08:00", "closes": "16:00" },
      { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "08:00", "closes": "12:00" }
    ],
    "sameAs": [{{ site.business.facebook | jsonify }}]
  }
  </script>
</head>
<body class="page-{{ page.slug | default: 'home' }}">
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
